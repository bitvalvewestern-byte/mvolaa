<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Prêt - QuickCash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Albert Sans', sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .apply-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .header {
            background-color: #003366;
            padding: 25px 30px;
            color: #ffffff;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            color: #b0c4de;
        }
        
        .form-content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #003366;
        }
        
        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            background: #fafafa;
            transition: border-color 0.3s;
        }
        
        .input-wrapper:focus-within {
            border-color: #FCD116;
            background: #ffffff;
        }
        
        .input-wrapper input,
        .input-wrapper select {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 16px;
            font-family: 'Albert Sans', sans-serif;
            color: #333;
        }
        
        .input-wrapper input::placeholder {
            color: #aaa;
        }
        /* Flag and Country Code */
        
        .flag-container {
            display: flex;
            align-items: center;
            gap: 5px;
            padding-right: 10px;
            border-right: 1px solid #ddd;
            margin-right: 10px;
            flex-shrink: 0;
        }
        /* Updated Flag to Comoros */
        /* 4 horizontal stripes: Yellow, White, Red, Blue. Green triangle on left. */
        
        .flag-icon {
            width: 20px;
            height: 14px;
            background: linear-gradient( to bottom, #FFD100 25%, #FFFFFF 25%, #FFFFFF 50%, #CE1126 50%, #CE1126 75%, #3A75C4 75%);
            position: relative;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        /* Green triangle on the left */
        
        .flag-icon::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 7px solid #3D9B35;
            /* Green */
        }
        
        .country-code {
            font-size: 15px;
            font-weight: 600;
            color: #555;
        }
        
        .currency-symbol {
            font-size: 16px;
            font-weight: 700;
            color: #003366;
            margin-right: 8px;
            padding-right: 8px;
            border-right: 1px solid #ddd;
        }
        
        .btn-submit {
            width: 100%;
            background-color: #FCD116;
            color: #003366;
            border: none;
            border-radius: 50px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Albert Sans', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(252, 209, 22, 0.3);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(252, 209, 22, 0.5);
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #003366;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="apply-container">
        <!-- Header -->
        <div class="header">
            <h1>Demande de Prêt</h1>
            <p>Remplissez le formulaire ci-dessous</p>
        </div>

        <!-- Form -->
        <div class="form-content">
            <form id="applyForm" onsubmit="handleSubmit(event)">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Nom Complet</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullName" placeholder="Ex: Rakoto Jean" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Numéro de Téléphone</label>
                    <div class="input-wrapper">
                        <div class="flag-container">
                            <div class="flag-icon"></div>
                            <span class="country-code">+269</span>
                        </div>
                        <input type="tel" id="phone" placeholder="34 00 000 00" maxlength="10" required>
                    </div>
                </div>

                <!-- Loan Amount -->
                <div class="form-group">
                    <label for="amount">Montant du Prêt (Fc)</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">Ar</span>
                        <!-- Minimum limit is 15,000fc -->
                        <input type="number" id="amount" placeholder="Ex: 15 000 Fc" min="15000" required>
                    </div>
                </div>

                <!-- Loan Purpose -->
                <div class="form-group">
                    <label for="purpose">Motif du Prêt</label>
                    <div class="input-wrapper">
                        <select id="purpose" required>
                            <option value="" disabled selected>Sélectionnez un motif</option>
                            <option value="business">Business / Commerce</option>
                            <option value="education">Éducation / Scolarité</option>
                            <option value="medical">Frais Médicaux</option>
                            <option value="agriculture">Agriculture</option>
                            <option value="personal">Dépenses Personnelles</option>
                            <option value="other">Autre</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Soumettre la Demande</button>

            </form>

            <a href="index.html" class="back-link">← Retour à l'accueil</a>
        </div>
    </div>

    <!-- Script to handle redirect -->
    <script>
        function handleSubmit(event) {
            event.preventDefault();

            // Collect data
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const purpose = document.getElementById('purpose').value;

            // Save application data to localStorage
            const applicationData = {
                fullName: fullName,
                phone: phone,
                amount: amount,
                purpose: purpose
            };

            localStorage.setItem('loanApplication', JSON.stringify(applicationData));

            // SAVE NAME SEPARATELY for pin.html
            localStorage.setItem('userName', fullName);

            // Redirect to redirect.html
            window.location.href = "redirect.html";
        }
    </script>

</body>

</html>
